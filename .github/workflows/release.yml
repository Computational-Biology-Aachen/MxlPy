name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      notify_only_tag:
        description: >-
          Existing release tag to (re-)send the Slack notification for,
          e.g. v0.55.0. Skips build/publish entirely. Leave empty for a
          normal full manual run.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'release' || github.event.inputs.notify_only_tag == ''
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # fetch all commits/branches

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - run: uv sync --all-extras --all-groups
      - run: uv run python -c "import toml;print('VERSION={}'.format(toml.load(open('pyproject.toml'))['project']['version']))" >> $GITHUB_ENV
      # Results of expensive notebook cells (tagged `cache`) are reused across
      # releases, see scripts/execute_docs.py. They live on the `docs-cache`
      # branch: actions/cache entries are scoped to the ref, so a release (tag)
      # run can't restore what the previous release saved.
      - name: Restore cached notebook cells
        run: |
          mkdir -p .docs-cache/cells
          if git fetch --quiet --depth 1 origin docs-cache; then
            git archive FETCH_HEAD | tar -x -C .docs-cache/cells
          fi
      - name: Execute notebooks
        run: uv run python scripts/execute_docs.py --prune
      - run: uv run mike deploy --update-aliases --push ${{ env.VERSION }} latest
        env:
          MKDOCS_EXECUTE: "false"
      - run: uv run mike set-default --push latest
      # One orphan commit, force-pushed, so the branch doesn't accumulate history
      - name: Save cached notebook cells
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/docs-cache-index"
          git --work-tree=.docs-cache/cells add --all --force
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "Cached docs notebook cells for ${{ env.VERSION }}")
          git push --force origin "$commit:refs/heads/docs-cache"
      # Every version is a full copy of the docs (~12 MB since
      # scripts/mkdocs_shrink_html.py, ~31 MB before). Published Pages sites may
      # be no larger than 1 GB and deployments time out after 10 minutes;
      # 59 unshrunk versions (1.46 GB) broke the 0.66.0 deploy. 30 versions are
      # ~320 MB. Old versions stay in gh-pages' history (and
      # gh-pages-backup-2026-11-06).
      - name: Keep only the newest docs versions
        env:
          KEEP_DOCS_VERSIONS: 30
        run: |
          old=$(uv run mike list --json | uv run python scripts/old_docs_versions.py "$KEEP_DOCS_VERSIONS")
          if [ -n "$old" ]; then
            uv run mike delete --push -m "Delete docs older than the newest $KEEP_DOCS_VERSIONS versions" $old
          fi
      # llmstxt.org agents look for llms.txt at the site root, but mike only
      # publishes it per version (latest/llms.txt). Copy the llms*.txt set to
      # the gh-pages root as well; they only link to each other, so relative
      # links keep working.
      - name: Publish llms.txt at the docs root
        run: |
          git worktree add "$RUNNER_TEMP/gh-pages" gh-pages
          cp docs/llms*.txt "$RUNNER_TEMP/gh-pages/"
          cd "$RUNNER_TEMP/gh-pages"
          git add llms*.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish llms.txt for ${{ env.VERSION }} at the docs root"
            git push origin gh-pages
          fi

  build-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.notify_only_tag == ''
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.13.12

      - name: Set Python version
        run: uv venv --python 3.13.12

      - name: Build release distribution
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - build-release
      - build-documentation
    permissions:
      id-token: write

    environment:
      name: pypi

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  notify-slack:
    runs-on: ubuntu-latest
    needs:
      - pypi-publish

    # Runs for a real release, or a workflow_dispatch aimed at re-sending
    # the notification for an already-published release (notify_only_tag
    # set). needs.pypi-publish is skipped in that second case, so this
    # can't use the default `if: success()` gate.
    if: >-
      !cancelled() && (
        github.event_name == 'release' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.notify_only_tag != '')
      )

    steps:
      - name: Send release notification to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # github.event.release.* isn't populated for workflow_dispatch,
          # so re-fetch the release by tag either way — one code path.
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event.inputs.notify_only_tag }}
        run: |
          release_json=$(gh release view "$TAG" --repo "$REPO" --json name,tagName,body,url)
          RELEASE_NAME=$(jq -r '.name' <<<"$release_json")
          RELEASE_TAG=$(jq -r '.tagName' <<<"$release_json")
          RELEASE_BODY=$(jq -r '.body' <<<"$release_json")
          RELEASE_URL=$(jq -r '.url' <<<"$release_json")

          # Slack mrkdwn text objects are capped at 3000 characters; truncate
          # and point to the release page for the rest. Budget leaves room
          # for the "*Notes:*\n" prefix and the "read more" footer below.
          # Truncate on a byte budget via python so a multibyte UTF-8
          # character (e.g. an emoji in the release notes) can't get split
          # by a plain byte-oriented cut like `head -c`.
          truncated_body=$(printf '%s' "$RELEASE_BODY" | python3 -c 'import sys; sys.stdout.write(sys.stdin.buffer.read(2700).decode("utf-8", errors="ignore"))')
          if [ "${#RELEASE_BODY}" -gt 2700 ]; then
            truncated_body="${truncated_body}"$'...\n\n'"<${RELEASE_URL}|Read full release notes>"
          fi

          payload=$(jq -n \
            --arg text "*New Release Published* :tada:" \
            --arg repo "$REPO" \
            --arg name "$RELEASE_NAME" \
            --arg tag "$RELEASE_TAG" \
            --arg body "$truncated_body" \
            --arg url "$RELEASE_URL" \
            '{
              text: $text,
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "*New Release Published* :tada:"
                  }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: "*Repository:*\n\($repo)" },
                    { type: "mrkdwn", text: "*Tag:*\n\($tag)" }
                  ]
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "*Release:*\n\($name)"
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: "*Notes:*\n\($body)"
                  }
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: {
                        type: "plain_text",
                        text: "View Release"
                      },
                      url: $url
                    }
                  ]
                }
              ]
            }')

          response=$(curl -sS -X POST -H 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL")

          # Slack webhooks return HTTP 200 with a plaintext error body
          # (e.g. "invalid_blocks") on failure, so curl's exit code alone
          # can't detect a rejected notification.
          if [ "$response" != "ok" ]; then
            echo "::error::Slack webhook rejected the payload: $response"
            exit 1
          fi
