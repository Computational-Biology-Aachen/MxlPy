name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  default-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.13.12

      - name: Set Python version
        run: uv venv --python 3.13.12

      - name: Set up minimal environment
        run: uv sync

      - name: Check that import always works
        run: uv run python -c "import mxlpy"

      - name: Set up maximal environment
        run: uv sync --all-extras --all-groups

      - name: Check the memory footprint of import mxlpy
        run: uv run python scripts/check_import_memory.py

      - name: Restore JAX compilation cache
        uses: actions/cache@v5
        with:
          path: .jax_cache
          # A new key per run, so programs added since the last save are kept;
          # restore falls back to the newest cache for this lockfile, then any.
          # PR runs can restore caches saved by the main-branch coverage run.
          key: jax-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            jax-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            jax-${{ runner.os }}-

      - name: Run tests
        env:
          # torch.optim.Optimizer.__init__ lazily imports torch._dynamo on
          # first construction (unrelated to torch.compile usage). Under
          # pytest-xdist, several workers hit that native-extension import
          # for the first time at nearly the same instant, which reliably
          # segfaults on the GitHub Actions runner. None of these tests use
          # torch.compile, so disabling dynamo avoids the crash-prone import
          # path without changing test behavior.
          TORCHDYNAMO_DISABLE: "1"
        run: uv run pytest -n auto --disable-warnings tests/

  # The fitting lab's web UI (web/lab), whose build is committed into the
  # package (src/mxlpy/lab/static) so users need no JS toolchain
  lab-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/lab
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15
          cache: npm
          cache-dependency-path: web/lab/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

      - name: Check that the committed build is up to date
        run: |
          if [ -n "$(git status --porcelain -- ../../src/mxlpy/lab/static)" ]; then
            git status --short -- ../../src/mxlpy/lab/static
            echo "::error::Rebuild the lab UI (npm run build in web/lab) and commit src/mxlpy/lab/static"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        working-directory: .
        run: |
          uv python install 3.13.12
          uv venv --python 3.13.12
          uv sync --extra lab

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/lab/test-results/
