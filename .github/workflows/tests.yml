name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  default-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.13.12

      - name: Set Python version
        run: uv venv --python 3.13.12

      - name: Set up minimal environment
        run: uv sync

      - name: Check that import always works
        run: uv run python -c "import mxlpy"

      - name: Set up maximal environment
        run: uv sync --all-extras --all-groups

      - name: Run tests
        env:
          # torch.optim.Optimizer.__init__ lazily imports torch._dynamo on
          # first construction (unrelated to torch.compile usage). Under
          # pytest-xdist, several workers hit that native-extension import
          # for the first time at nearly the same instant, which reliably
          # segfaults on the GitHub Actions runner. None of these tests use
          # torch.compile, so disabling dynamo avoids the crash-prone import
          # path without changing test behavior.
          TORCHDYNAMO_DISABLE: "1"
        run: uv run pytest -n auto --disable-warnings tests/
