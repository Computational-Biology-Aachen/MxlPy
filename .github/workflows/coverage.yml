name: ci

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  default-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.13.12

      - name: Set Python version
        run: uv venv --python 3.13.12

      - name: Set up environment
        run: uv sync --all-extras --all-groups

      - name: Restore JAX compilation cache
        uses: actions/cache@v5
        with:
          path: .jax_cache
          # A new key per run, so programs added since the last save are kept;
          # restore falls back to the newest cache for this lockfile, then any.
          # PR runs can restore caches saved by the main-branch coverage run.
          key: jax-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            jax-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
            jax-${{ runner.os }}-

      - name: Run tests
        run: uv run pytest -n auto --disable-warnings --cov --cov-report json tests/

      - name: Get coverage value
        run: python -c "import json;
          print('COVERAGE={}'.format(json.load(open('coverage.json'))['totals']['percent_covered_display']))"
          >> $GITHUB_ENV

      - name: Coverage badge
        uses: schneegans/dynamic-badges-action@v1.8.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 98ab3ce1db511de42f9871e91d85e4cd
          filename: coverage.json
          label: Coverage
          message: ${{ env.COVERAGE }}
          valColorRange: ${{ env.COVERAGE }}
          maxColorRange: 100
          minColorRange: 0
